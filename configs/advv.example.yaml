schema_version: '2.0'
project: ADVV
run:
  seed: 42
  output_root: ../assets/outputs
  strategy: random_until_quota
  target_count: null
  quota_scope: total
  limit_policy: until_target_or_user_stop
  max_attempts: null
  max_wall_time_seconds: null
  source_schedule: round_robin
  chain_augmentation: false
dataset:
  root: ../assets/inputs
  input_dir: ../assets/inputs
  image: null
  manifest: null
  task: image_only
  eligible_splits:
  - source
  - train
  enforce_group_disjoint: true
  enforce_cross_split_hash_disjoint: true
generation:
  source_prompt: A dashcam image of a road traffic accident involving one or more
    vehicles.
  augmentation_prompt: null
sampler:
  version: accident_group_v1
  operations:
  - relocation
  geometry_attempts: 64
segmentation:
  backend: torchvision_maskrcnn_resnet50_fpn
  weights_id: COCO_V1
  weights_path: ../models/segmentation/maskrcnn_resnet50_fpn_coco-bf2d0c1e.pth
  weights_sha256: null
  class_ids:
  - 3
  - 4
  - 6
  - 8
  score_threshold: 0.5
  mask_threshold: 0.5
  min_area_pixels: 32
execution:
  mode: gpu_pairs_parallel
  conda_environment: ADVV
  selected_gpu_ids: null
  candidate_concurrency: auto
  worker_timeout_seconds: 1800
  max_technical_retries: 1
  max_consecutive_technical_failures: 3
  retry_oom: false
generator:
  backend: dragflow
  repo_path: ../third_party/DragFlow
  revision: b3a8fa7136df5131d07f98425c0d189fb6ca74b0
  upstream_config: ../third_party/DragFlow/framework/config.yaml
  weights_lock: ../models/weights.clip.lock.json
  parameters: {}
verifier:
  backend: clip_local
  model_id: openai/clip-vit-large-patch14
  model_path: null
  model_revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
  local_files_only: true
  criteria_path: ../prompts/clip_criteria_v1.json
  preprocessing: letterbox_bicubic_gray_v1
storage:
  atomic_writes: true
  retain_rejected_details: false
  cleanup_existing: true
export:
  reject_fake_backend: true
  deduplicate_exact_pixels: true
  deduplicate_against_source: true
visualization:
  enabled: true
  save_drag_plan: true
  save_comparison: true
  save_metadata: true
  max_panel_side_px: 1024
  area_color: '#2196F3'
  area_alpha: 0.25
  draw_area_outline: true
  start_color: '#E53935'
  end_color: '#43A047'
  arrow_color: '#FFD600'
  show_anchor: true
  anchor_color: '#AB47BC'
report:
  terminal_progress: true
accident_selection:
  method: clip_contact_context_v1
  captions_path: ../prompts/accident_vehicles_v1.json
  context_padding: 0.25
