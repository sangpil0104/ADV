schema_version: '2.0'
project: ADVV
run:
  seed: 42
  output_root: ../assets/outputs
  strategy: random_until_quota
  target_count: null
  quota_scope: total
  limit_policy: until_target_or_user_stop
  max_attempts: null
  max_wall_time_seconds: null
  source_schedule: round_robin
  chain_augmentation: false
dataset:
  root: ../assets/inputs
  input_dir: ../assets/inputs
  image: null
  manifest: null
  task: image_only
  eligible_splits:
  - source
  - train
  enforce_group_disjoint: true
  enforce_cross_split_hash_disjoint: true
  # The run snapshot (inputs/images/*.png) is downscaled so its long side is at most this
  # many pixels; segmentation, selection, sampler, DragFlow and CLIP all use the snapshot,
  # so accepted images have the snapshot resolution. Originals are never modified and
  # smaller images are never upscaled. null keeps the original resolution.
  max_long_side_px: 960
  downscale_resample: lanczos
generation:
  source_prompt: A dashcam image of a road traffic accident involving one or more
    vehicles.
  augmentation_prompt: null
sampler:
  version: accident_group_v3
  operations:
  - relocation
  geometry_attempts: 64
  # Common group displacement: radius r in [floor, cap], angle uniform over the directions
  # that keep the group in frame/grid at that r with floor <= |delta| <= cap (r is redrawn if
  # none), delta = round(r cos, vertical_scale * r sin). D = accident group mask bbox diagonal.
  # cap = max_displacement_fraction x D;
  # floor = max(min_displacement_fraction x D, min_displacement_image_diag_fraction x image
  # diagonal) and applies to the rounded |delta| AFTER vertical_scale.
  # Sources with no valid move, including small groups whose floor exceeds the cap, are held
  # before generation (the cap is never raised). Initial values are UNVERIFIED guesses;
  # decide them with the GPU sweep (SPEC 5.3). max was lowered 0.3 -> 0.15 on 2026-10-12 and
  # the floor raised 0.03 x D -> max(0.08 x D, 0.03 x image diagonal) on 2026-10-14 after
  # visual failures (still unverified).
  max_displacement_fraction: 0.15
  min_displacement_fraction: 0.08
  min_displacement_image_diag_fraction: 0.03
  vertical_scale: 0.5
  magnitude_distribution: uniform_radius
segmentation:
  backend: torchvision_maskrcnn_resnet50_fpn
  weights_id: COCO_V1
  weights_path: ../models/segmentation/maskrcnn_resnet50_fpn_coco-bf2d0c1e.pth
  weights_sha256: null
  class_ids:
  - 3
  - 4
  - 6
  - 8
  score_threshold: 0.5
  mask_threshold: 0.5
  min_area_pixels: 32
execution:
  mode: gpu_pairs_parallel
  conda_environment: ADVV
  selected_gpu_ids: null
  candidate_concurrency: auto
  worker_timeout_seconds: 1800
  max_technical_retries: 1
  max_consecutive_technical_failures: 3
  retry_oom: false
generator:
  backend: dragflow
  repo_path: ../third_party/DragFlow
  revision: b3a8fa7136df5131d07f98425c0d189fb6ca74b0
  upstream_config: ../third_party/DragFlow/framework/config.yaml
  weights_lock: ../models/weights.clip.lock.json
  parameters: {}
verifier:
  backend: clip_local
  model_id: openai/clip-vit-large-patch14
  model_path: null
  model_revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
  local_files_only: true
  criteria_path: ../prompts/clip_criteria_v1.json
  preprocessing: letterbox_bicubic_gray_v1
storage:
  atomic_writes: true
  retain_rejected_details: false
  cleanup_existing: true
export:
  reject_fake_backend: true
  deduplicate_exact_pixels: true
  deduplicate_against_source: true
visualization:
  enabled: true
  save_drag_plan: true
  save_comparison: true
  save_metadata: true
  max_panel_side_px: 1024
  area_color: '#2196F3'
  area_alpha: 0.25
  draw_area_outline: true
  start_color: '#E53935'
  end_color: '#43A047'
  arrow_color: '#FFD600'
  show_anchor: true
  anchor_color: '#AB47BC'
report:
  terminal_progress: true
accident_selection:
  method: clip_contact_context_v3
  captions_path: ../prompts/accident_vehicles_v3.json
  context_padding: 0.25
  # Deterministic pre-CLIP rules. v2 rules set from the 10 development images (M009), v3
  # detection filters from the blackbox_002 960px Mask R-CNN results (M011); unverified.
  rules:
    # Camera car hood: bbox bottom within 5% of image height from the bottom edge,
    # bbox width >= 60% of image width, area >= 10% of the image.
    ego_bottom_margin_fraction: 0.05
    ego_min_width_fraction: 0.6
    ego_min_area_fraction: 0.1
    # Two detections with IoU >= this are one vehicle (union mask kept).
    duplicate_min_iou: 0.5
    # Two vehicles whose mask gap is at most this x the smaller vehicle's bbox diagonal
    # count as touching (thin segmentation gaps; masks never grow).
    contact_gap_fraction: 0.015
    # In a contact unit, a vehicle smaller than ratio x the largest vehicle whose bbox bottom
    # is higher by more than gap x the largest vehicle's bbox height is a distant vehicle
    # overlapping only in perspective; it is excluded without CLIP scoring.
    distant_max_area_ratio: 0.1
    distant_min_bottom_gap_fraction: 0.25
    # v3 detection false-positive filters, applied to each merged vehicle unit (duplicates
    # merged, confidence = its best detection) after the hood rule and before contact analysis.
    detection_min_score: 0.7
    # Unit mask area as a fraction of the image (a close crash car reached 0.25).
    max_area_fraction: 0.4
    min_area_fraction: 0.001
    # Top-edge structure: bbox top within this x H of the top edge AND bbox bottom at or
    # above this x H (hangs from the top, e.g. a building facade detected as a bus).
    top_touch_margin_fraction: 0.05
    top_touch_max_bottom_fraction: 0.6
    # Ground height: bbox bottom at or above this x H from the top is not on the road.
    min_bottom_fraction: 0.1
    # Largest 8-connected piece / unit mask area (pieces split by e.g. a pedestrian).
    min_largest_component_fraction: 0.7
